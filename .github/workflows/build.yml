name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # 1. تحميل المشروع
      - name: Checkout project
        uses: actions/checkout@v4

      # 2. تثبيت Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. تثبيت Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 4. تثبيت أدوات النظام المطلوبة
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev

      # 5. تثبيت Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # 6. تثبيت Android SDK Platform و Build Tools
      - name: Install Android SDK components
        run: |
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # 7. التأكد من وجود AIDL
      - name: Verify Android tools
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo "Checking build-tools..."
          ls -la "$ANDROID_SDK_ROOT/build-tools/35.0.0"

          echo "Checking AIDL..."
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/aidl" --version

      # 8. تثبيت Buildozer و Cython
      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install "Cython<3"
          pip install buildozer

      # 9. تنظيف ملفات البناء القديمة
      - name: Clean previous Buildozer files
        run: |
          rm -rf .buildozer
          rm -rf bin

      # 10. بناء APK
      - name: Build APK
        run: |
          buildozer android debug

      # 11. عرض الملفات الناتجة
      - name: List APK files
        run: |
          echo "APK files:"
          find . -type f -name "*.apk" -print

      # 12. رفع APK كـ Artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Calculator-APK
          path: bin/*.apk
          if-no-files-found: error
