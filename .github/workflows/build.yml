name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            autopoint \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            ccache \
            lld \
            make \
            gcc \
            g++ \
            patch \
            wget \
            lbzip2

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK tools
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install Python build tools
        run: |
          python --version
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer==1.6.0

      - name: Check build environment
        run: |
          echo "===================================="
          echo "Python:"
          python --version

          echo "===================================="
          echo "Pip:"
          python -m pip --version

          echo "===================================="
          echo "Buildozer:"
          buildozer version

          echo "===================================="
          echo "Java:"
          java -version

          echo "===================================="
          echo "JAVA_HOME:"
          echo "$JAVA_HOME"

          echo "===================================="
          echo "ANDROID_HOME:"
          echo "$ANDROID_HOME"

          echo "===================================="
          echo "ANDROID_SDK_ROOT:"
          echo "$ANDROID_SDK_ROOT"

          echo "===================================="
          echo "SDK build-tools:"
          ls -la "$ANDROID_SDK_ROOT/build-tools"

          echo "===================================="
          echo "SDK platforms:"
          ls -la "$ANDROID_SDK_ROOT/platforms"

      - name: Clean previous Buildozer files
        run: |
          rm -rf .buildozer
          rm -rf bin

          echo "Buildozer cache cleaned."

      - name: Check project files
        run: |
          echo "===================================="
          echo "Project files:"
          ls -la

          echo "===================================="
          echo "buildozer.spec:"
          cat buildozer.spec

      - name: Build APK with Buildozer
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          echo "===================================="
          echo "Starting Buildozer..."

          python --version
          buildozer version

          echo "===================================="

          buildozer android debug

      - name: List APK files
        run: |
          echo "===================================="
          echo "Generated APK files:"

          find . -type f -name "*.apk" -print

          echo "===================================="
          echo "Contents of bin:"

          ls -lah bin || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Calculator-APK
          path: bin/*.apk
          if-no-files-found: error
