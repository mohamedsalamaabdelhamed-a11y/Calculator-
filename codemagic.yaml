
workflows:
  kivy-android-debug:
    name: Kivy Calculator Android Debug
    max_build_duration: 120
    instance_type: linux_x2

    environment:
      vars:
        BUILDOZER_WARN_ON_ROOT: "0"

    scripts:

      - name: Check project files
        script: |
          echo "===== PROJECT FILES ====="
          ls -la
          echo "===== MAIN.PY ====="
          head -30 main.py
          echo "===== BUILDOZER.SPEC ====="
          cat buildozer.spec

      - name: Install system dependencies
        script: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            ccache \
            lld

      - name: Set up Python
        script: |
          python3 --version
          python3 -m pip install --upgrade pip setuptools wheel

      - name: Install Buildozer and Cython
        script: |
          python3 -m pip install "Cython==0.29.36"
          python3 -m pip install "buildozer==1.5.0"

      - name: Build APK with Buildozer
        script: |
          rm -rf .buildozer
          rm -rf bin

          echo "===== BUILD START ====="
          yes | buildozer -v android debug

          echo "===== BUILD FINISHED ====="
          ls -lah bin/

    artifacts:
      - bin/*.apk
