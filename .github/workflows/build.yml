name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # 1. تحميل المشروع
      - name: Checkout project
        uses: actions/checkout@v4

      # 2. تثبيت Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. تثبيت Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 4. تثبيت أدوات النظام المطلوبة لبناء Kivy / Buildozer
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            ccache \
            lld

      # 5. تثبيت Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # 6. تثبيت المكونات والموافقة على التراخيص
      - name: Install Android SDK components & Accept Licenses
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      # 7. تثبيت Buildozer و Cython
      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install "Cython>=0.29.33,<3.0.0"
          pip install buildozer

      # 8. تنظيف ملفات البناء القديمة
      - name: Clean previous Buildozer files
        run: |
          rm -rf .buildozer
          rm -rf bin

      # 9. بناء APK مع ضبط المتغيرات البيئية
      - name: Build APK with Buildozer
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          # قبول كافة تراخيص SDK داخلياً
          yes | buildozer android debug

      # 10. عرض الملفات الناتجة
      - name: List APK files
        run: |
          echo "Generated APK files:"
          find . -type f -name "*.apk" -print

      # 11. رفع APK كـ Artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Calculator-APK
          path: bin/*.apk
          if-no-files-found: error
