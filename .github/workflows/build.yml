name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # 1. تحميل المشروع
      - name: Checkout project
        uses: actions/checkout@v4


      # 2. تثبيت Python 3.11
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # 3. تثبيت Java 17 (تم التحديث إلى v5 لحل تحذير الإيقاف)
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # 4. تثبيت أدوات النظام المطلوبة
      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            ccache \
            lld \
            openjdk-17-jdk


      # 5. تثبيت Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3


      # 6. تثبيت مادي لمكونات Android SDK والموافقة الآلية على التراخيص
      - name: Install Android SDK components & Accept Licenses
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true
          yes | $ANDROID_HOME/tools/bin/sdkmanager --licenses || true

          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" || true


      # 7. فحص Android SDK و AIDL
      - name: Check Android SDK and AIDL
        run: |
          echo "===================================="
          echo "ANDROID_SDK_ROOT:"
          echo "$ANDROID_SDK_ROOT"

          echo "===================================="
          echo "ANDROID_HOME:"
          echo "$ANDROID_HOME"

          echo "===================================="
          echo "Build-tools directories:"
          find "$ANDROID_SDK_ROOT/build-tools" \
            -maxdepth 1 \
            -mindepth 1 \
            -type d \
            -print || true


      # 8. تثبيت أدوات Python و Buildozer و Cython المعتمدة
      - name: Install Python build tools
        run: |
          python --version
          python -m pip --version

          python -m pip install --upgrade pip setuptools wheel

          python -m pip install \
            "Cython>=0.29.33,<3.0.0"

          python -m pip install buildozer


      # 9. التأكد من إصدارات البيئة
      - name: Check build environment
        run: |
          echo "===================================="
          echo "Python:"
          python --version

          echo "===================================="
          echo "Buildozer:"
          which buildozer
          buildozer version

          echo "===================================="
          echo "Java:"
          java -version

          echo "===================================="
          echo "JAVA_HOME:"
          echo "$JAVA_HOME"


      # 10. تنظيف ملفات البناء القديمة
      - name: Clean previous Buildozer files
        run: |
          rm -rf .buildozer
          rm -rf bin

          echo "Old Buildozer files removed."


      # 11. التأكد من ملفات المشروع
      - name: Check project files
        run: |
          echo "Project files:"
          ls -la

          echo "------------------------------------"

          echo "buildozer.spec:"
          cat buildozer.spec


      # 12. بناء APK مع الموافقة التلقائية التامة على الاستفسارات
      - name: Build APK with Buildozer
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          echo "Starting Buildozer..."

          yes | buildozer -v android debug


      # 13. عرض ملفات APK الناتجة
      - name: List APK files
        run: |
          echo "Generated APK files:"

          find . -type f -name "*.apk" -print

          echo "Contents of bin:"
          ls -lah bin || true


      # 14. رفع APK كـ Artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Calculator-APK
          path: bin/*.apk
          if-no-files-found: error
