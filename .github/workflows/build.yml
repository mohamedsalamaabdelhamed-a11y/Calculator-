name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # 1. تحميل المشروع
      - name: Checkout project
        uses: actions/checkout@v4


      # 2. تثبيت Python 3.11 بالكامل في البيئة
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # 3. تثبيت Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # 4. تثبيت حزم وأدوات النظام المطلوبة
      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            ccache \
            lld \
            openjdk-17-jdk


      # 5. تثبيت Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3


      # 6. تثبيت مادي لمكونات Android SDK والتراخيص
      - name: Install Android SDK components
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true

          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" || true


      # 7. تثبيت أدوات Python وحزم التجميع مع تحديد الإصدارات
      - name: Install Python build tools
        run: |
          python3.11 -m pip install --upgrade pip setuptools wheel
          python3.11 -m pip install "Cython>=0.29.33,<3.0.0" buildozer


      # 8. تنظيف بيئات البناء القديمة
      - name: Clean previous Buildozer files
        run: |
          rm -rf .buildozer
          rm -rf bin


      # 9. تنفيذ عملية البناء بإنفاذ Python 3.11
      - name: Build APK with Buildozer
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          echo "Starting Buildozer..."
          yes | python3.11 -m buildozer -v android debug


      # 10. رفع الـ APK الناتج
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Calculator-APK
          path: bin/*.apk
          if-no-files-found: error
