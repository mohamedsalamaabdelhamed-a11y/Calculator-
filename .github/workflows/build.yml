name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # 1. تحميل المشروع
      - name: Checkout project
        uses: actions/checkout@v4


      # 2. تثبيت Python 3.12
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # 3. تثبيت Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # 4. تثبيت أدوات النظام المطلوبة
      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            ccache \
            lld


      # 5. تثبيت Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3


      # 6. تثبيت Android SDK components
      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"


      # 7. فحص Android SDK و AIDL
      - name: Check Android SDK and AIDL
        run: |
          echo "===================================="
          echo "ANDROID_SDK_ROOT:"
          echo "$ANDROID_SDK_ROOT"

          echo "===================================="
          echo "ANDROID_HOME:"
          echo "$ANDROID_HOME"

          echo "===================================="
          echo "Installed build-tools:"
          find "$ANDROID_SDK_ROOT/build-tools" -maxdepth 2 -type f -name aidl -print

          echo "===================================="
          echo "Checking AIDL versions:"

          AIDL_FOUND=0

          while IFS= read -r file; do
            echo "------------------------------------"
            echo "Checking:"
            echo "$file"

            "$file" --version || true

            AIDL_FOUND=1
          done < <(find "$ANDROID_SDK_ROOT/build-tools" -type f -name aidl)

          echo "===================================="

          if [ "$AIDL_FOUND" -eq 0 ]; then
            echo "ERROR: AIDL was NOT found!"
            exit 1
          else
            echo "SUCCESS: AIDL was found."
          fi


      # 8. تثبيت أدوات Python
      - name: Install Python build tools
        run: |
          python --version
          python -m pip --version

          python -m pip install --upgrade pip setuptools wheel

          python -m pip install \
            "Cython>=0.29.33,<3.0.0"

          python -m pip install buildozer


      # 9. التأكد من الإصدارات
      - name: Check build environment
        run: |
          echo "===================================="
          echo "Python:"
          python --version

          echo "===================================="
          echo "Python location:"
          which python

          echo "===================================="
          echo "Pip:"
          python -m pip --version

          echo "===================================="
          echo "Buildozer:"
          which buildozer
          buildozer version

          echo "===================================="
          echo "Java:"
          java -version

          echo "===================================="
          echo "JAVA_HOME:"
          echo "$JAVA_HOME"

          echo "===================================="
          echo "ANDROID_HOME:"
          echo "$ANDROID_HOME"

          echo "===================================="
          echo "ANDROID_SDK_ROOT:"
          echo "$ANDROID_SDK_ROOT"


      # 10. تنظيف أي ملفات بناء قديمة
      - name: Clean previous Buildozer files
        run: |
          rm -rf .buildozer
          rm -rf bin

          echo "Old Buildozer files removed."


      # 11. التأكد من ملفات المشروع
      - name: Check project files
        run: |
          echo "Project files:"
          ls -la

          echo "------------------------------------"

          echo "buildozer.spec:"
          cat buildozer.spec


      # 12. بناء APK
      - name: Build APK with Buildozer
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          echo "Starting Buildozer..."

          echo "Python version:"
          python --version

          echo "Buildozer version:"
          buildozer version

          yes | buildozer android debug


      # 13. عرض ملفات APK الناتجة
      - name: List APK files
        run: |
          echo "Generated APK files:"

          find . -type f -name "*.apk" -print

          echo "Contents of bin:"
          ls -lah bin || true


      # 14. رفع APK كـ Artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Calculator-APK
          path: bin/*.apk
          if-no-files-found: error
